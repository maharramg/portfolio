<!DOCTYPE html>
<html lang="en">
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="Maharram Guliyev is a Flutter developer building iOS and Android apps. See his projects, experience and contact details." />
    <meta name="theme-color" content="#010623" />

    <!-- Link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://maharramguliyev.com/" />
    <meta property="og:title" content="Maharram Guliyev | Flutter Developer" />
    <meta property="og:description" content="Maharram Guliyev is a Flutter developer building iOS and Android apps. See his projects, experience and contact details." />
    <meta property="og:image" content="https://maharramguliyev.com/icons/Icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Maharram Guliyev" />
    <link rel="apple-touch-icon" href="icons/favicon.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="icons/favicon.png" />

    <title>Maharram Guliyev | Flutter Developer</title>
    <link rel="manifest" href="manifest.json" />
  </head>
  <body style="margin: 0; background: #010623">
    <style>
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
      }
      #splash .logo {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      #splash .spinner {
        width: 24px;
        height: 24px;
        border: 2.5px solid rgba(255, 255, 255, 0.25);
        border-top-color: #fff;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <div id="splash">
      <div class="logo">
        <img src="assets/assets/images/icons/mg-icon-white.png" alt="" style="height: 84px; border-radius: 16px" />
        <img src="assets/assets/images/icons/main-icon-light.png" alt="" style="height: 60px" />
      </div>
      <div class="spinner" role="progressbar" aria-label="Loading"></div>
    </div>
    <script>
      window.addEventListener("flutter-first-frame", () => document.getElementById("splash")?.remove());
    </script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
